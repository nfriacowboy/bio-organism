services:
  snn-db:
    image: postgres:16-alpine
    container_name: snn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snn-net

  snn-mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: snn-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@snn-db:5432/${POSTGRES_DB}
      --artifacts-destination /mlartifacts
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_TRACKING_URI: http://snn-mlflow:5000
    volumes:
      - mlflow_artifacts:/mlartifacts
    ports:
      - "5000:5000"
    depends_on:
      snn-db:
        condition: service_healthy
    networks:
      - snn-net

  snn-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: snn-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME}
      API_SECRET_KEY: ${API_SECRET_KEY}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      snn-db:
        condition: service_healthy
    networks:
      - snn-net
    profiles:
      - full

  snn-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: snn-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - snn-api
    networks:
      - snn-net
    profiles:
      - full

  snn-trainer:
    build:
      context: ./trainer
      dockerfile: Dockerfile
    container_name: snn-trainer
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME}
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION}
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES}
    volumes:
      - ./trainer/src:/app/src
      - mlflow_artifacts:/mlartifacts
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    depends_on:
      snn-db:
        condition: service_healthy
      snn-mlflow:
        condition: service_started
    networks:
      - snn-net
    profiles:
      - full
    command: ["sleep", "infinity"]

volumes:
  postgres_data:
  mlflow_artifacts:

networks:
  snn-net:
    driver: bridge
