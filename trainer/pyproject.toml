[project]
name = "snn-trainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.0",
    "spikingjelly>=0.0.0.0.14",
    "snntorch>=0.9.0",
    "pykan>=0.2.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "mlflow>=2.14.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "plotext>=5.2.0",
    "scipy>=1.11.0",
]

[tool.uv.sources]
torch = { index = "rocm" }

[[tool.uv.index]]
name = "rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true
